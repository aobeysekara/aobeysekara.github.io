name: Refresh GitHub repos

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Fetch public repos and write _data/github_repos.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: aobeysekara
        run: |
          set -euo pipefail
          gh api "/users/${GH_USER}/repos?per_page=100&sort=updated&type=owner" --paginate \
            --jq '
              [
                .[]
                | select(.fork == false)
                | select(.archived == false)
                | select(.name != "aobeysekara.github.io")
                | select((.description // "") != "")
                | {
                    name: .name,
                    description: .description,
                    language: .language,
                    stars: .stargazers_count,
                    url: .html_url,
                    updated: (.updated_at | sub("T.*"; ""))
                  }
              ]
            ' > /tmp/repos.json
          python3 - <<'PY' > _data/github_repos.yml
          import json, yaml
          with open("/tmp/repos.json") as fh:
              repos = json.load(fh)
          print(yaml.safe_dump(repos, sort_keys=False, allow_unicode=True).rstrip())
          PY

      - name: Open PR if changed
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: refresh GitHub repos data"
          branch: chore/refresh-github-repos
          delete-branch: true
          sign-commits: true
          title: "chore: refresh GitHub repos data"
          body: |
            Auto-generated by `.github/workflows/refresh-github-repos.yml`.
            Updates `_data/github_repos.yml` from the public GitHub profile.
